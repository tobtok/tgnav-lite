[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgnav-lite"
version = "0.2.0"
description = "Static site generator for SEO-friendly Telegram group & channel directories. JSON in, pure HTML out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tobtok" }]
requires-python = ">=3.9"
dependencies = ["Jinja2>=3.1"]
keywords = ["telegram", "static-site", "generator", "seo", "directory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tgnav-build = "generator.build:main"

[tool.setuptools]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
