name: Bug report
description: Something in the generator or templates is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact generator error message if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Command run + the JSON entry (redact private data).
      placeholder: |
        python generator/build.py
        [ { "name": "...", "username": "...", ... } ]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tgnav-lite version / commit
      placeholder: v0.2.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
